# 게이트웨이 설정 예시. config/gateway.yaml 로 복사해서 쓴다 (gateway.yaml 은 커밋하지 않음).
#   cp config/gateway.example.yaml config/gateway.yaml

name: satc-mcp-gateway

upstreams:
  - name: my-mcp-server
    # streamable-http 로 띄운 upstream MCP 서버 주소. ${VAR:-기본값} 치환 지원
    url: ${SATC_MCP_SERVER_URL:-http://localhost:5555/mcp}
    # upstream 이 하나면 prefix 없이 원래 도구 이름 그대로 노출
    prefix: null
    # 도구 메타데이터. config/registry/example.yaml 형식으로 작성
    registry: registry/example.yaml

exposure:
  # all: 모든 도구 노출 / dynamic: core + activate_tools 로 켠 도구만 노출
  # dynamic 은 클라이언트가 notifications/tools/list_changed 를 지원해야 한다
  mode: all
  search_top_k: 5

policy:
  # allow / deny / confirm(실행 전 사용자 확인, MCP elicitation)
  side_effects:
    read: allow
    write: allow
    exec: allow
    external: allow
    unknown: allow
  deny_tools: []
  confirm_tools: []
  # confirm 대상인데 클라이언트가 elicitation 을 지원하지 않을 때
  confirm_fallback: deny
  timeouts:
    read: 60
    write: 120
    exec: 300
    external: 120
    unknown: 120
  tool_timeouts: {}

audit:
  path: ../logs/audit.jsonl
  max_arg_chars: 500

registry_ttl_s: 300
