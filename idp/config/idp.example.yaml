# satc-idp 설정 예시. config/idp.yaml 로 복사해서 쓴다 (idp.yaml 은 커밋하지 않음).
#   cp config/idp.example.yaml config/idp.yaml
#
# 로컬 http 테스트만 할 때는 issuer 를 http://127.0.0.1:5700 으로, cookie_secure 를 false 로 바꾼다.
# (https 도 loopback 도 아닌 issuer, loopback 이 아닌데 cookie_secure: false 는 기동을 거부한다)

# 토큰 iss, discovery 기준 URL
issuer: https://idp.example.com

# 경로는 이 파일 기준 상대 경로. data/ 는 커밋하지 않는다
db_path: ../data/idp.sqlite3
keystore_dir: ../data/keys
audit_path: ../data/audit.jsonl

access_token_ttl_s: 900                  # 15분
refresh_token_ttl_s: 1209600             # 14일 (회전할 때마다)
refresh_family_max_lifetime_s: 2592000   # 30일 (최초 로그인 기준 절대 수명, 회전해도 늘지 않음)
code_ttl_s: 60
login_request_ttl_s: 600
max_pending_login_requests: 10000        # 처리 전 로그인 요청 전체 상한
max_pending_login_requests_per_ip: 20    # IP 당 처리 전 로그인 요청 상한 (소수 IP 가 전체 상한을 채우는 것 방지)
max_form_bytes: 16384                    # /token, /revoke, POST /authorize 본문 최대 크기
max_form_fields: 30                      # 위 본문의 최대 필드 수

# 토큰 aud 로 허용할 값 (RFC 8707 resource). 첫 번째가 기본값. 보통 게이트웨이 MCP URL
# 클라이언트별로 더 좁히려면 clients add --audience
allowed_audiences:
  - https://gateway.example.com/mcp

scopes: [mcp]

# 키 교체 직후에도 기존 토큰을 검증할 수 있도록 JWKS 에 남겨 둘 이전 키 수
published_previous_keys: 1

# 로그인 쿠키에 Secure + __Host- 접두사. loopback issuer 의 로컬 http 테스트만 false
cookie_secure: true

# 리버스 프록시 IP/CIDR. 여기서 온 요청만 X-Forwarded-For 를 보고 "신뢰하지 않는 가장 오른쪽" 값을 쓴다.
# 비어 있으면 X-Forwarded-For 를 무시하고 접속 주소를 쓴다.
# - "*" 나 0.0.0.0/0 같은 /0 은 기동 거부 (X-Forwarded-For 위조로 IP 잠금·속도 제한이 무력화된다)
# - TLS 리버스 프록시 뒤인데 비워 두면 모든 사용자가 프록시 IP 하나로 보여 IP 잠금을 함께 받는다 (https issuer 면 경고)
forwarded_allow_ips: []

# argon2(64MiB/건) 동시 검증 수, 없는 클라이언트 인증 실패 시 고정 지연
argon2_max_concurrency: 4
unknown_client_delay_s: 0.05

lockout:
  window_s: 900
  pair_max_failures: 5        # (사용자, IP) 쌍 잠금 — 주 방어선
  ip_max_failures: 20         # IP 전체 잠금 (여러 사용자를 돌려 대입)
  backoff_after: 10           # 사용자 전체 실패가 서로 다른 IP 이 수 곳 이상에서 나오면 지수 백오프
  backoff_base_s: 1
  backoff_max_s: 60
  user_max_failures: 100      # 사용자 전체 하드 잠금 (남이 계정을 잠그는 DoS 라 높게)
  trusted_ttl_s: 2592000      # 로그인 성공한 (사용자, IP)·기기 쿠키를 기억하는 기간. 사용자 전체 백오프·하드 잠금에서 뺀다

# IP 당 분당 요청 수
rate_limits:
  authorize_per_minute: 60
  token_per_minute: 120
  revoke_per_minute: 60

# 동적 클라이언트 등록 (MCP 클라이언트가 스스로 등록할 때). 공개 클라이언트, loopback redirect 만 받는다
dcr:
  enabled: false
  allow_localhost: true         # http://localhost:<포트>/... 허용 (Claude Code 가 쓴다). false 면 127.0.0.1·[::1] 만
  allowed_redirect_uris: []     # loopback 외에 허용할 redirect_uri (정확히 일치)
  default_scopes: [mcp]         # 생략하면 전체 scopes
  rate_limit_per_hour: 10
  max_clients: 1000
  unused_client_ttl_s: 604800   # 등록 뒤 이 기간 토큰을 한 번도 받지 않은 클라이언트는 지운다.
                                # 토큰을 받은 클라이언트는 마지막 사용이 refresh_family_max_lifetime_s 보다 오래됐을 때만 지운다
  max_body_bytes: 16384
  audiences: []                 # 비어 있으면 allowed_audiences 전체
