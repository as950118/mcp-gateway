# 도구 검색 평가셋 예시 (eval/upstream_tools.snapshot.example.json 기준)
#
# 실제 평가셋은 eval/tool_queries.yaml 로 만들고 커밋하지 않는다.
# 작성 규칙: 레지스트리를 보지 않은 사람(또는 에이전트)이 도구 설명만 보고, 실제 사용자 말투로 쓴다.
# 진짜 애매한 경우만 expected 에 여러 도구를 둔다.
queries:
  - query: "이번 작업 java 프로젝트야, 경로는 ~/work/api"
    expected: [get_project_info]
  - query: "billing 스키마에 테이블 어떤 거 있어?"
    expected: [list_db_tables]
  - query: "users 테이블 필드 타입 좀 알려줘"
    expected: [get_table_columns]
  - query: "dev 클러스터 argo 네임스페이스 pod 상태"
    expected: [list_pods]
  - query: "api 파드 최근 로그 200줄"
    expected: [get_pod_logs]
  - query: "백엔드 엔드포인트 swagger 문서 만들어줘"
    expected: [generate_api_docs]
  - query: "Product 엔티티 리스트·디테일 페이지 뼈대"
    expected: [scaffold_frontend_entity]
  - query: "작업한 거 커밋해서 dev로 머지 요청 올려"
    expected: [create_pull_request]
